[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragsearch"
version = "0.0.1"
description = "Adaptive RAG Search: a retrieval pipeline search and evaluation framework"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
dense = ["numpy", "sentence-transformers", "faiss-cpu"]

[tool.setuptools.packages.find]
include = ["ragsearch*"]
